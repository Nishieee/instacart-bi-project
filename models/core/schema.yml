version: 2

models:
  - name: order_details
    description: "Fact table combining orders, products, and time dimensions"
    columns:
      - name: order_id
        tests: [not_null]
      - name: user_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: product_name
      - name: order_dow
      - name: day_name
      - name: is_weekend